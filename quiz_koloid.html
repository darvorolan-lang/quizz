<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Koloid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b2d35;--panel:#11404b;--ink:#f6f1e0;--mute:#a7c9cc;--line:rgba(246,241,224,.16);--c1:#ef5f3c;--c2:#1fb5b0;--c3:#f5b700;--c4:#5bbf5a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:radial-gradient(1200px 700px at 20% -10%,#17606c 0,transparent 60%),radial-gradient(900px 600px at 110% 110%,#1b4b3a 0,transparent 55%),var(--bg);min-height:100vh;overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.fade{animation:fi .45s ease both;width:100%;max-width:760px}
@keyframes fi{from{opacity:0;transform:translateY(12px) scale(.98)}}
.card-main,.result,.play{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:clamp(20px,4vw,36px);box-shadow:0 18px 40px rgba(0,0,0,.35);text-align:center}
.kicker{letter-spacing:.2em;text-transform:uppercase;font:800 .8rem Nunito,sans-serif;color:var(--c3)}
h1{font:800 clamp(2.6rem,9vw,4.6rem)/1 Poppins,sans-serif;margin:.25em 0 .3em}
h1 span{background:linear-gradient(90deg,var(--c3),var(--c1));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);font-size:1.1rem;max-width:32em;margin:0 auto 18px}
.field{display:block;text-align:left;margin:18px auto;max-width:360px;font-weight:800}
.field input{display:block;width:100%;margin-top:8px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:rgba(0,0,0,.2);color:var(--ink);font:700 1.1rem Nunito,sans-serif}
.go{display:inline-block;margin:8px 6px;padding:16px 28px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--c3),var(--c1));color:#0b2d35;font:800 1.15rem Poppins,sans-serif;box-shadow:0 7px 0 #8a4a1f;cursor:pointer}
.go:active{transform:translateY(4px);box-shadow:0 3px 0 #8a4a1f}
.ghost{margin:8px 6px;padding:14px 22px;border-radius:14px;border:2px solid var(--line);background:transparent;color:var(--ink);font:800 1rem Poppins,sans-serif;cursor:pointer}
.tiny{font-size:.95rem;color:var(--mute);margin:12px 0}
.hide{display:none}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.hud{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
.chip{padding:6px 14px;border-radius:99px;background:rgba(0,0,0,.25);border:1px solid var(--line);font:800 .95rem Nunito,sans-serif}
.chip.hot{background:var(--c1);color:#0b2d35;border-color:transparent}
.timer{height:12px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin:10px 0 18px}
#tbar{height:100%;width:100%;background:linear-gradient(90deg,var(--c3),var(--c1))}
.qbox p{margin:0;font:800 .95rem Nunito,sans-serif;color:var(--c3)}
.qbox h2{font:800 clamp(1.35rem,4vw,2rem)/1.25 Poppins,sans-serif;margin:.2em 0 18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;min-height:76px;padding:16px 18px;border:0;border-radius:16px;background:var(--c);color:#0b2d35;font:700 1.05rem Poppins,sans-serif;box-shadow:0 6px 0 rgba(0,0,0,.35);cursor:pointer;transition:transform .15s,opacity .25s,filter .25s,box-shadow .25s}
.opt:not(:disabled):hover{transform:translateY(-2px)}
.opt:disabled{cursor:default}
.opt .sh{font-size:1.5rem;flex:0 0 auto;width:28px;text-align:center}
.opt.dim{opacity:.3;filter:grayscale(.6)}
.opt.right{box-shadow:0 0 0 4px #fff,0 0 28px #fff;transform:scale(1.03)}
.opt.wrong{opacity:.45}
.res{min-height:3.4em;margin:16px 0 4px;font-size:1.05rem}
.res b{font:800 1.2rem Poppins,sans-serif;color:var(--c3)}
.big{font-size:clamp(4rem,16vw,7.5rem)}
.mid{font-size:clamp(2rem,7vw,3rem)}
.rank{font:800 1.3rem Poppins,sans-serif;color:var(--c4);margin:6px 0;min-height:1.6em}
.board{list-style:none;padding:0;margin:14px auto;max-width:520px;text-align:left}
.board li{display:flex;align-items:center;gap:12px;padding:12px 16px;margin:8px 0;border-radius:14px;background:rgba(0,0,0,.22);border:1px solid var(--line);font-weight:800;font-size:1.05rem}
.board li .pos{font:800 1rem Poppins,sans-serif;color:var(--c3);min-width:48px}
.board li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board li .pts{font:800 1.1rem Poppins,sans-serif}
.board li.me{background:linear-gradient(90deg,rgba(245,183,0,.35),rgba(239,95,60,.3));border-color:var(--c3)}
.board li:first-child .pos{color:#ffd54a}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.fx i{position:absolute;top:-16px;width:10px;height:14px;border-radius:3px;animation:fall 2.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(var(--r));opacity:.9}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LIMIT=15000;
const SH=['▲','◆','●','■'];
const CL=['var(--c1)','var(--c2)','var(--c3)','var(--c4)'];
const CL_RAW=['#ef5f3c','#1fb5b0','#f5b700','#5bbf5a'];
const Q=[
{q:'Berapa rentang ukuran partikel koloid?',o:['Kurang dari 1 nm','1–100 nm','100–1000 nm','Lebih dari 1 µm'],a:1,f:'Di bawah 1 nm itu larutan, di atas 100 nm sudah suspensi.'},
{q:'Dalam susu, lemak termasuk apa?',o:['Medium pendispersi','Fase terdispersi','Larutan','Pelarut'],a:1,f:'Lemak tersebar di dalam air, jadi lemak adalah fase terdispersi.'},
{q:'Kenapa berkas senter terlihat jelas saat melewati koloid?',o:['Efek Doppler','Efek Tyndall','Efek Compton','Efek Hall'],a:1,f:'Partikel koloid menghamburkan cahaya, dan itu yang membuat jalurnya terlihat.'},
{q:'Gerakan acak partikel koloid karena ditumbuk molekul medium disebut?',o:['Gerak Brown','Gerak lurus','Adsorpsi','Koagulasi'],a:0,f:'Namanya dari Robert Brown, yang mengamatinya pada serbuk sari dalam air.'},
{q:'Kabut termasuk jenis koloid apa?',o:['Aerosol cair','Aerosol padat','Sol','Buih'],a:0,f:'Fase terdispersinya air (cair) di dalam udara (gas).'},
{q:'Sol Fe(OH)₃ terbentuk saat FeCl₃ diteteskan ke air mendidih. Warnanya?',o:['Biru tua','Hijau','Merah kecokelatan','Bening'],a:2,f:'Warna itu tanda sol Fe(OH)₃ sudah terbentuk.'},
{q:'Maizena yang hanya diaduk dengan air dingin termasuk apa?',o:['Larutan','Koloid','Suspensi','Emulsi'],a:2,f:'Granulanya sekitar 5–30 µm, terlalu besar untuk jadi koloid, jadi mengendap.'},
{q:'Metode yang memecah partikel besar menjadi koloid disebut?',o:['Kondensasi','Dispersi','Hidrolisis','Koagulasi'],a:1,f:'Contohnya penggilingan dan busur Bredig.'},
{q:'Penggumpalan partikel koloid yang membuatnya mengendap disebut?',o:['Adsorpsi','Elektroforesis','Koagulasi','Gerak Brown'],a:2,f:'Contohnya air sungai yang dijernihkan dengan tawas.'},
{q:'Oobleck (maizena + air) termasuk fluida apa?',o:['Newtonian','Non-Newtonian','Larutan sejati','Gas'],a:1,f:'Kekentalannya naik saat ditekan atau digeser dengan cepat.'}
];

let S={name:'Pemain',qi:0,score:0,streak:0,answers:[],locked:false,t0:0,timer:null,adv:null};
let db=null,uid=null,board=[],boardState='loading';

/* latar: partikel koloid bergerak acak */
const cv=$('#bg'),cx=cv.getContext('2d');
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=0,H=0,P=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;P=Array.from({length:44},(_,i)=>({x:Math.random()*W,y:Math.random()*H,r:3+Math.random()*9,vx:0,vy:0,c:CL_RAW[i%4]}))}
rs();addEventListener('resize',rs);
function frame(){cx.clearRect(0,0,W,H);for(const p of P){if(!still){p.vx=(p.vx+(Math.random()-.5)*.5)*.97;p.vy=(p.vy+(Math.random()-.5)*.5)*.97;p.x=(p.x+p.vx+W)%W;p.y=(p.y+p.vy+H)%H}cx.globalAlpha=.16;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill()}cx.globalAlpha=1;requestAnimationFrame(frame)}
frame();

/* klik semua tombol lewat satu pendengar */
app.addEventListener('click',e=>{
  const o=e.target.closest('[data-i]');
  if(o&&!o.disabled){answer(+o.dataset.i);return}
  const a=e.target.closest('[data-a]');
  if(!a)return;
  const act=a.dataset.a;
  if(act==='start')start();
  else if(act==='board')showBoard();
  else if(act==='home')renderIntro();
  else if(act==='next'){clearTimeout(S.adv);S.qi++;nextQ()}
});

function dbNote(){
  if(boardState==='loading')return 'Menghubungkan papan skor...';
  if(boardState==='ready')return 'Papan skor online aktif. Skormu tersimpan saat kuis selesai.';
  if(boardState==='error')return 'Papan skor belum bisa dimuat sekarang.';
  return 'Mode lokal: papan skor online belum aktif. Login dengan akun yang punya akses kontributor untuk ikut.';
}

function renderIntro(){
  clearInterval(S.timer);clearTimeout(S.adv);
  app.innerHTML=`<section class="card-main fade">
    <div class="kicker">kuis interaktif</div>
    <h1>Quiz <span>Koloid</span></h1>
    <p class="sub">10 soal, 15 detik per soal. Makin cepat dan makin beruntun jawabanmu benar, makin tinggi skormu.</p>
    <label class="field">Nama kamu<input id="nm" maxlength="16" placeholder="contoh: Dina" autocomplete="off"></label>
    <div class="row"><button class="go" data-a="start">Mulai main!</button><button class="ghost" data-a="board">Papan skor</button></div>
    <p class="tiny" id="dbnote">${dbNote()}</p>
  </section>`;
  const nm=$('#nm');if(nm&&S.name!=='Pemain')nm.value=S.name;
}

function start(){
  const v=(($('#nm')||{}).value||'').trim();
  S.name=v||'Pemain';S.qi=0;S.score=0;S.streak=0;S.answers=[];
  nextQ();
}

function nextQ(){
  if(S.qi>=Q.length)return showResult();
  const it=Q[S.qi];
  S.locked=false;
  app.innerHTML=`<section class="play fade">
    <div class="hud"><span class="chip">Soal ${S.qi+1}/${Q.length}</span><span class="chip">Skor ${S.score}</span>${S.streak>1?`<span class="chip hot">🔥 ${S.streak}x beruntun</span>`:''}</div>
    <div class="timer"><div id="tbar"></div></div>
    <div class="qbox"><p>Sisa waktu <span id="tsec">15</span> detik</p><h2>${it.q}</h2></div>
    <div class="opts">${it.o.map((t,i)=>`<button class="opt" data-i="${i}" style="--c:${CL[i]}"><span class="sh">${SH[i]}</span><span>${t}</span></button>`).join('')}</div>
    <p id="res" class="res"></p>
    <button class="go hide" id="nx" data-a="next">Lanjut ➜</button>
  </section>`;
  S.t0=performance.now();
  clearInterval(S.timer);S.timer=setInterval(tickQ,60);
}

function tickQ(){
  if(S.locked)return;
  const left=Math.max(0,LIMIT-(performance.now()-S.t0));
  const bar=$('#tbar'),sec=$('#tsec');
  if(bar)bar.style.width=(left/LIMIT*100)+'%';
  if(sec)sec.textContent=Math.ceil(left/1000);
  if(left<=0)answer(-1);
}

function answer(i){
  if(S.locked)return;
  S.locked=true;clearInterval(S.timer);
  const it=Q[S.qi];
  const el=performance.now()-S.t0;
  const ok=i===it.a;
  let gain=0;
  if(ok){S.streak++;gain=500+Math.round(500*Math.max(0,1-el/LIMIT))+Math.min(S.streak-1,3)*50}
  else S.streak=0;
  S.score+=gain;S.answers.push(ok);
  document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;b.classList.add(k===it.a?'right':k===i?'wrong':'dim')});
  const r=$('#res');
  if(r)r.innerHTML=(ok?`<b>Benar! +${gain}</b>`:i===-1?'<b>Waktu habis!</b>':'<b>Belum tepat.</b>')+' '+it.f;
  const nx=$('#nx');if(nx)nx.classList.remove('hide');
  clearTimeout(S.adv);
  S.adv=setTimeout(()=>{S.qi++;nextQ()},5000);
}

function showResult(){
  clearInterval(S.timer);clearTimeout(S.adv);
  const benar=S.answers.filter(Boolean).length;
  app.innerHTML=`<section class="result fade">
    <div class="kicker">kuis selesai</div>
    <h1 class="big">${S.score}</h1>
    <p class="sub">${esc(S.name)}, kamu menjawab benar ${benar} dari ${Q.length} soal.</p>
    <p class="rank" id="rank"></p>
    <p class="tiny" id="savemsg">Menyimpan skor...</p>
    <div class="row"><button class="go" data-a="start">Main lagi</button><button class="ghost" data-a="board">Papan skor</button></div>
  </section>`;
  confetti();
  saveScore();
  updateRank();
}

function boardHTML(){
  if(boardState==='error')return '<p class="tiny">Papan skor belum bisa dimuat sekarang.</p>';
  if(boardState==='loading')return '<p class="tiny">Memuat papan skor...</p>';
  if(boardState==='none')return '<p class="tiny">Papan skor online belum aktif di sini. Skormu tetap tampil di layar hasil.</p>';
  if(!board.length)return '<p class="tiny">Belum ada skor. Jadilah yang pertama!</p>';
  return '<ol class="board">'+board.map((r,i)=>`<li class="${r.id===uid?'me':''}"><span class="pos">#${i+1}</span><span class="nm">${esc(r.name||'Pemain')}</span><span class="pts">${Number(r.score)||0}</span></li>`).join('')+'</ol>';
}

function showBoard(){
  clearInterval(S.timer);clearTimeout(S.adv);
  app.innerHTML=`<section class="result fade">
    <div class="kicker">papan skor</div>
    <h1 class="mid">Top 10</h1>
    <div id="boardWrap">${boardHTML()}</div>
    <div class="row"><button class="go" data-a="start">Main sekarang</button><button class="ghost" data-a="home">Kembali</button></div>
  </section>`;
}

function refreshBoard(){
  const w=$('#boardWrap');if(w)w.innerHTML=boardHTML();
  const dn=$('#dbnote');if(dn)dn.textContent=dbNote();
  updateRank();
}

function updateRank(){
  const el=$('#rank');if(!el)return;
  if(boardState!=='ready'){el.textContent='';return}
  const i=board.findIndex(r=>r.id===uid);
  el.textContent=i>=0?`Peringkat #${i+1} di papan skor`:'';
}

function setSave(msg){const el=$('#savemsg');if(el)el.textContent=msg}

async function saveScore(){
  if(!db||!uid){setSave('Skor belum tersimpan di papan skor. Login dengan akun yang punya akses kontributor untuk ikut.');return}
  try{
    const ref=db.collection('scores').doc(uid);
    const snap=await ref.get();
    const prev=(snap.exists&&snap.data())?(Number(snap.data().score)||0):-1;
    if(S.score>prev){
      await ref.set({name:S.name,score:S.score,at:Date.now()});
      setSave('Skor tersimpan di papan skor!');
    }else{
      setSave(`Skor ini belum melewati skor terbaikmu (${prev}).`);
    }
  }catch(e){
    setSave('Skor belum bisa disimpan sekarang. Mungkin kamu perlu akses kontributor.');
  }
}

function confetti(){
  const wrap=document.createElement('div');wrap.className='fx';
  for(let i=0;i<70;i++){
    const s=document.createElement('i');
    s.style.left=Math.random()*100+'%';
    s.style.background=CL_RAW[i%4];
    s.style.animationDelay=(Math.random()*.6)+'s';
    s.style.setProperty('--r',(Math.random()*720-360)+'deg');
    wrap.appendChild(s);
  }
  document.body.appendChild(wrap);
  setTimeout(()=>wrap.remove(),3500);
}

async function boot(){
  const cap=async n=>{try{return (window.claude&&claude.use)?await claude.use(n):null}catch(e){return null}};
  const d=await cap('db');
  const u=await cap('user');
  try{uid=u?await u.id():null}catch(e){uid=null}
  if(!d){boardState='none';refreshBoard();return}
  db=d;
  db.collection('scores').orderBy('score','desc').limit(10).onSnapshot(
    snap=>{board=snap.docs.map(x=>({id:x.id,...(x.data()||{})}));boardState='ready';refreshBoard()},
    ()=>{boardState='error';refreshBoard()}
  );
}

renderIntro();
boot();
</script>
</body>
</html>
