<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kahoot Koloid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b2d35;--panel:#11404b;--ink:#f6f1e0;--mute:#a7c9cc;--line:rgba(246,241,224,.16);--c1:#ef5f3c;--c2:#1fb5b0;--c3:#f5b700;--c4:#5bbf5a;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:radial-gradient(1200px 700px at 20% -10%,#17606c 0,transparent 60%),radial-gradient(900px 600px at 110% 110%,#1b4b3a 0,transparent 55%),var(--bg);min-height:100vh;overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.fade{animation:fi .45s ease both;width:100%;max-width:800px}
@keyframes fi{from{opacity:0;transform:translateY(12px) scale(.98)}}
.card-main,.result,.play{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:clamp(20px,4vw,36px);box-shadow:0 18px 40px rgba(0,0,0,.35);text-align:center}
.kicker{letter-spacing:.2em;text-transform:uppercase;font:800 .8rem Nunito,sans-serif;color:var(--c3)}
h1{font:800 clamp(2.4rem,8vw,4.2rem)/1 Poppins,sans-serif;margin:.25em 0 .3em}
h1 span{background:linear-gradient(90deg,var(--c3),var(--c1));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);font-size:1.05rem;max-width:34em;margin:0 auto 18px}
.field{display:block;text-align:left;margin:14px auto;max-width:380px;font-weight:800}
.field input{display:block;width:100%;margin-top:8px;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:rgba(0,0,0,.2);color:var(--ink);font:700 1.1rem Nunito,sans-serif}
.go{display:inline-block;margin:8px 6px;padding:16px 26px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--c3),var(--c1));color:#0b2d35;font:800 1.1rem Poppins,sans-serif;box-shadow:0 7px 0 #8a4a1f;cursor:pointer}
.go:disabled{opacity:.45;cursor:default;box-shadow:0 7px 0 #5a3a20}
.go:not(:disabled):active{transform:translateY(4px);box-shadow:0 3px 0 #8a4a1f}
.ghost{margin:8px 6px;padding:14px 22px;border-radius:14px;border:2px solid var(--line);background:transparent;color:var(--ink);font:800 1rem Poppins,sans-serif;cursor:pointer}
.tiny{font-size:.95rem;color:var(--mute);margin:12px 0}
.err{color:#ffb4a0;min-height:1.4em;font-weight:800;margin:6px 0}
.divider{border:0;border-top:1px solid var(--line);margin:20px 0}
.hide{display:none}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.hud{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
.chip{padding:6px 14px;border-radius:99px;background:rgba(0,0,0,.25);border:1px solid var(--line);font:800 .95rem Nunito,sans-serif}
.timer{height:12px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin:10px 0 18px}
#tbar{height:100%;width:100%;background:linear-gradient(90deg,var(--c3),var(--c1))}
.qbox h2{font:800 clamp(1.3rem,4vw,2rem)/1.25 Poppins,sans-serif;margin:.2em 0 18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;min-height:76px;padding:16px 18px;border:0;border-radius:16px;background:var(--c);color:#0b2d35;font:700 1.05rem Poppins,sans-serif;box-shadow:0 6px 0 rgba(0,0,0,.35);cursor:pointer;transition:transform .15s,opacity .25s,filter .25s,box-shadow .25s}
.opt:not(:disabled):hover{transform:translateY(-2px)}
.opt:disabled{cursor:default}
.opt .sh{font-size:1.5rem;flex:0 0 auto;width:28px;text-align:center}
.opt.dim{opacity:.3;filter:grayscale(.6)}
.opt.right{box-shadow:0 0 0 4px #fff,0 0 28px #fff;transform:scale(1.03)}
.opt.wrong{opacity:.45}
.opt.picked{box-shadow:0 0 0 4px #fff;transform:scale(1.02)}
.res{min-height:3.4em;margin:16px 0 4px;font-size:1.05rem}
.res b{font:800 1.2rem Poppins,sans-serif;color:var(--c3)}
.big{font-size:clamp(4rem,14vw,7rem)}
.mid{font-size:clamp(2rem,7vw,3rem)}
.pin{font:800 clamp(2.6rem,12vw,5.2rem)/1 Poppins,sans-serif;letter-spacing:.14em;color:var(--c3);margin:14px 0 6px;text-shadow:0 6px 0 rgba(0,0,0,.3)}
.pchip{display:inline-block;margin:5px;padding:8px 14px;border-radius:99px;background:var(--c2);color:#0b2d35;font:800 1rem Nunito,sans-serif;animation:pop .4s cubic-bezier(.2,.9,.3,1.4) both}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.pcount{font:800 1rem Nunito,sans-serif;color:var(--mute)}
.pulse{font-size:2rem;color:var(--c1);animation:pl 1.2s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.4);opacity:.4}}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin:22px 0 10px;min-height:250px}
.step{width:31%;max-width:190px;border-radius:16px 16px 6px 6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:12px 8px;border:1px solid var(--line);animation:rise .9s cubic-bezier(.2,.9,.3,1.1) both;color:#0b2d35}
.s1{background:linear-gradient(180deg,#ffd54a,#f5b700)}.s2{background:linear-gradient(180deg,#8fe3df,#1fb5b0)}.s3{background:linear-gradient(180deg,#ffb199,#ef5f3c)}
@keyframes rise{from{transform:translateY(60%);opacity:0}}
.medal{font-size:2rem}
.sn{font:800 1.05rem Poppins,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.ss{font:800 1.2rem Poppins,sans-serif}
.bars{text-align:left;margin:14px 0}
.brow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) 40px;gap:10px;align-items:center;margin:10px 0;font-weight:800}
.blabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btrack{height:22px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.bfill{height:100%;background:var(--c);border-radius:99px;transition:width .5s ease}
.board{list-style:none;padding:0;margin:14px auto;max-width:520px;text-align:left}
.board li{display:flex;align-items:center;gap:12px;padding:10px 16px;margin:8px 0;border-radius:14px;background:rgba(0,0,0,.22);border:1px solid var(--line);font-weight:800}
.board li .pos{font:800 1rem Poppins,sans-serif;color:var(--c3);min-width:44px}
.board li .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board li .pts{font:800 1.05rem Poppins,sans-serif}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.fx i{position:absolute;top:-16px;width:10px;height:14px;border-radius:3px;animation:fall 2.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(var(--r));opacity:.9}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<main id="app"><section class="card-main fade"><p class="sub">Menyiapkan kuis...</p></section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ===== KONFIGURASI: cukup ganti dua baris ini ===== */
const CONFIG = {
  databaseURL: 'https://khoot-68054-default-rtdb.asia-southeast1.firebasedatabase.app/',
  hostCode: 'akuganteng'
};
/* ================================================= */

const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LIMIT=15000;
const SH=['▲','◆','●','■'];
const CL=['var(--c1)','var(--c2)','var(--c3)','var(--c4)'];
const CL_RAW=['#ef5f3c','#1fb5b0','#f5b700','#5bbf5a'];
const Q=[
{q:'Berapa rentang ukuran partikel koloid?',o:['Kurang dari 1 nm','1–100 nm','100–1000 nm','Lebih dari 1 µm'],a:1,f:'Di bawah 1 nm itu larutan, di atas 100 nm sudah suspensi.'},
{q:'Dalam susu, lemak termasuk apa?',o:['Medium pendispersi','Fase terdispersi','Larutan','Pelarut'],a:1,f:'Lemak tersebar di dalam air, jadi lemak adalah fase terdispersi.'},
{q:'Kenapa berkas senter terlihat jelas saat melewati koloid?',o:['Efek Doppler','Efek Tyndall','Efek Compton','Efek Hall'],a:1,f:'Partikel koloid menghamburkan cahaya, dan itu yang membuat jalurnya terlihat.'},
{q:'Gerakan acak partikel koloid karena ditumbuk molekul medium disebut?',o:['Gerak Brown','Gerak lurus','Adsorpsi','Koagulasi'],a:0,f:'Namanya dari Robert Brown, yang mengamatinya pada serbuk sari dalam air.'},
{q:'Kabut termasuk jenis koloid apa?',o:['Aerosol cair','Aerosol padat','Sol','Buih'],a:0,f:'Fase terdispersinya air (cair) di dalam udara (gas).'},
{q:'Sol Fe(OH)₃ terbentuk saat FeCl₃ diteteskan ke air mendidih. Warnanya?',o:['Biru tua','Hijau','Merah kecokelatan','Bening'],a:2,f:'Warna itu tanda sol Fe(OH)₃ sudah terbentuk.'},
{q:'Maizena yang hanya diaduk dengan air dingin termasuk apa?',o:['Larutan','Koloid','Suspensi','Emulsi'],a:2,f:'Granulanya sekitar 5–30 µm, terlalu besar untuk jadi koloid, jadi mengendap.'},
{q:'Metode yang memecah partikel besar menjadi koloid disebut?',o:['Kondensasi','Dispersi','Hidrolisis','Koagulasi'],a:1,f:'Contohnya penggilingan dan busur Bredig.'},
{q:'Penggumpalan partikel koloid yang membuatnya mengendap disebut?',o:['Adsorpsi','Elektroforesis','Koagulasi','Gerak Brown'],a:2,f:'Contohnya air sungai yang dijernihkan dengan tawas.'},
{q:'Oobleck (maizena + air) termasuk fluida apa?',o:['Newtonian','Non-Newtonian','Larutan sejati','Gas'],a:1,f:'Kekentalannya naik saat ditekan atau digeser dengan cepat.'}
];

/* ===== keadaan aplikasi ===== */
let db=null;
const st={uid:'',role:null,screen:'',pin:'',name:'',phase:'',qi:-1,t0:0,timer:null,locked:false,lastQi:-2,revealed:-1,endShown:false,
  myScore:0,streak:0,lastI:-1,lastGain:0,players:[],answers:[],offs:[],adv:null};

function getUid(){
  let u=null;
  try{u=sessionStorage.getItem('kh_uid')}catch(e){}
  if(!u){
    u=Math.random().toString(36).slice(2,10)+Date.now().toString(36);
    try{sessionStorage.setItem('kh_uid',u)}catch(e){}
  }
  return u;
}
st.uid=getUid();

/* latar: partikel koloid bergerak acak */
const cv=$('#bg'),cx=cv.getContext('2d');
const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
let W=0,H=0,P=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;P=Array.from({length:44},(_,i)=>({x:Math.random()*W,y:Math.random()*H,r:3+Math.random()*9,vx:0,vy:0,c:CL_RAW[i%4]}))}
rs();addEventListener('resize',rs);
function frame(){cx.clearRect(0,0,W,H);for(const p of P){if(!still){p.vx=(p.vx+(Math.random()-.5)*.5)*.97;p.vy=(p.vy+(Math.random()-.5)*.5)*.97;p.x=(p.x+p.vx+W)%W;p.y=(p.y+p.vy+H)%H}cx.globalAlpha=.16;cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill()}cx.globalAlpha=1;requestAnimationFrame(frame)}
frame();

/* satu pendengar klik untuk semua tombol */
app.addEventListener('click',e=>{
  const o=e.target.closest('[data-i]');
  if(o&&!o.disabled){playerAnswer(+o.dataset.i);return}
  const a=e.target.closest('[data-a]');
  if(!a)return;
  const act=a.dataset.a;
  if(act==='host')createGame();
  else if(act==='join')joinGame();
  else if(act==='start')hostStart();
  else if(act==='skip')hostReveal();
  else if(act==='hnext')hostNext();
  else if(act==='leave')leave();
});

function setErr(m){const el=$('#err');if(el)el.textContent=m}
function fmtPin(p){return p.slice(0,3)+' '+p.slice(3)}
function toList(v){return v?Object.keys(v).map(k=>({id:k,...(v[k]||{})})):[]}
function sortedPlayers(){return [...st.players].sort((a,b)=>(Number(b.score)||0)-(Number(a.score)||0))}
function tiles(it,interactive){
  return it.o.map((t,i)=>`<button class="opt"${interactive?` data-i="${i}"`:' disabled'} style="--c:${CL[i]}"><span class="sh">${SH[i]}</span><span>${t}</span></button>`).join('');
}
function podiumHTML(list){
  const slots=[1,0,2].map(k=>{
    const p=list[k];
    const h=[210,160,120][k];
    return `<div class="step s${k+1}" style="height:${h}px;animation-delay:${[.5,.2,.8][k]}s"><div class="medal">${['🥇','🥈','🥉'][k]}</div><div class="sn">${p?esc(p.name||'Pemain'):'—'}</div><div class="ss">${p?(Number(p.score)||0):''}</div></div>`;
  }).join('');
  return `<div class="podium">${slots}</div>`;
}
function restHTML(list){
  const rest=list.slice(3,10);
  if(!rest.length)return '';
  return '<ol class="board" start="4">'+rest.map((r,i)=>`<li><span class="pos">#${i+4}</span><span class="nm">${esc(r.name||'Pemain')}</span><span class="pts">${Number(r.score)||0}</span></li>`).join('')+'</ol>';
}
function miniBoard(){
  const list=sortedPlayers().slice(0,5);
  if(!list.length)return '';
  return '<ol class="board">'+list.map((r,i)=>`<li><span class="pos">#${i+1}</span><span class="nm">${esc(r.name||'Pemain')}</span><span class="pts">${Number(r.score)||0}</span></li>`).join('')+'</ol>';
}
function confetti(){
  const wrap=document.createElement('div');wrap.className='fx';
  for(let i=0;i<70;i++){
    const s=document.createElement('i');
    s.style.left=Math.random()*100+'%';
    s.style.background=CL_RAW[i%4];
    s.style.animationDelay=(Math.random()*.6)+'s';
    s.style.setProperty('--r',(Math.random()*720-360)+'deg');
    wrap.appendChild(s);
  }
  document.body.appendChild(wrap);
  setTimeout(()=>wrap.remove(),3500);
}
function clearAll(){
  st.offs.forEach(f=>{try{f()}catch(e){}});
  st.offs=[];
  clearInterval(st.timer);clearTimeout(st.adv);
}
function on(ref,fn){ref.on('value',fn);st.offs.push(()=>ref.off('value',fn))}

/* ===== layar awal ===== */
function renderSetup(){
  app.innerHTML=`<section class="card-main fade">
    <div class="kicker">belum disiapkan</div>
    <h1>Kahoot <span>Koloid</span></h1>
    <p class="sub">Isi <b>databaseURL</b> di bagian CONFIG pada file ini dengan URL Realtime Database kamu, lalu muat ulang halaman.</p>
  </section>`;
}

function renderHome(){
  clearAll();
  st.role=null;st.pin='';st.players=[];st.answers=[];st.endShown=false;
  st.screen='home';
  app.innerHTML=`<section class="card-main fade">
    <div class="kicker">kuis langsung</div>
    <h1>Kahoot <span>Koloid</span></h1>
    <p class="sub">Host membuat game, peserta masuk pakai PIN. Host yang memulai saat semua peserta sudah masuk.</p>
    <label class="field">PIN game<input id="pin" inputmode="numeric" maxlength="6" placeholder="6 digit" autocomplete="off"></label>
    <label class="field">Nama kamu<input id="nm" maxlength="16" placeholder="contoh: Dina" autocomplete="off"></label>
    <button class="go" data-a="join">Masuk game</button>
    <hr class="divider">
    <label class="field">Kode host<input id="hc" type="password" placeholder="kode untuk host" autocomplete="off"></label>
    <button class="ghost" data-a="host">Buat game (host)</button>
    <p class="err" id="err"></p>
  </section>`;
}

/* ===== HOST ===== */
async function createGame(){
  const code=(($('#hc')||{}).value||'').trim();
  if(code!==CONFIG.hostCode){setErr('Kode host salah.');return}
  try{
    let pin='';
    for(let k=0;k<6&&!pin;k++){
      const c=String(100000+Math.floor(Math.random()*900000));
      const s=await db.ref('rooms/'+c).once('value');
      if(!s.exists())pin=c;
    }
    if(!pin)throw new Error('pin');
    await db.ref('rooms/'+pin).set({phase:'lobby',qi:-1,total:Q.length,at:Date.now()});
    st.role='host';st.pin=pin;st.phase='lobby';st.endShown=false;
    subscribeHost();
    renderHostLobby();
  }catch(e){
    renderHome();setErr('Gagal membuat game. Cek databaseURL dan aturan database.');
  }
}

function subscribeHost(){
  const pin=st.pin;
  on(db.ref('players/'+pin),s=>{st.players=toList(s.val());onPlayers()});
  on(db.ref('answers/'+pin),s=>{st.answers=toList(s.val());onAnswers()});
}

function setRoom(patch){
  if(!db||!st.pin)return;
  db.ref('rooms/'+st.pin).update(patch).catch(()=>{});
}

function renderHostLobby(){
  st.screen='hlobby';
  app.innerHTML=`<section class="card-main fade">
    <div class="kicker">host · lobby</div>
    <p class="sub">Peserta buka halaman ini, pilih <b>Masuk game</b>, lalu masukkan PIN:</p>
    <div class="pin">${fmtPin(st.pin)}</div>
    <div id="plist"></div>
    <p class="pcount" id="pcount"></p>
    <div class="row"><button class="go" id="gostart" data-a="start" disabled>Mulai sekarang</button><button class="ghost" data-a="leave">Batalkan</button></div>
  </section>`;
  updateLobby();
}

function updateLobby(){
  const el=$('#plist');if(!el)return;
  const html=st.players.map(p=>`<span class="pchip">${esc(p.name||'Pemain')}</span>`).join('');
  el.innerHTML=html||'<p class="tiny">Belum ada peserta...</p>';
  const c=$('#pcount');if(c)c.textContent=st.players.length+' peserta sudah masuk';
  const b=$('#gostart');if(b)b.disabled=!st.players.length;
}

function hostStart(){
  if(!st.players.length)return;
  st.qi=0;
  setRoom({phase:'q',qi:0});
  hostShowQ();
}

function hostShowQ(){
  st.phase='q';st.locked=false;st.screen='hq';
  const it=Q[st.qi];
  app.innerHTML=`<section class="play fade">
    <div class="hud"><span class="chip">Soal ${st.qi+1}/${Q.length}</span><span class="chip" id="ansc">0/${st.players.length} sudah jawab</span></div>
    <div class="timer"><div id="tbar"></div></div>
    <div class="qbox"><h2>${it.q}</h2></div>
    <div class="opts">${tiles(it,false)}</div>
    <div class="row"><button class="ghost" data-a="skip">Lihat hasil ➜</button></div>
  </section>`;
  st.t0=performance.now();
  clearInterval(st.timer);st.timer=setInterval(hostTick,60);
  onAnswers();
}

function hostTick(){
  if(st.phase!=='q')return;
  const left=Math.max(0,LIMIT-(performance.now()-st.t0));
  const bar=$('#tbar');if(bar)bar.style.width=(left/LIMIT*100)+'%';
  if(left<=0)hostReveal();
}

function countAns(){return st.answers.filter(a=>a.qi===st.qi).length}

function onAnswers(){
  if(st.role!=='host'||st.phase!=='q')return;
  const n=countAns();
  const c=$('#ansc');if(c)c.textContent=n+'/'+st.players.length+' sudah jawab';
  if(st.players.length&&n>=st.players.length)hostReveal();
}

function hostReveal(){
  if(st.phase!=='q')return;
  clearInterval(st.timer);
  st.phase='reveal';st.screen='hreveal';
  setRoom({phase:'reveal',qi:st.qi});
  const it=Q[st.qi];
  const cnt=[0,0,0,0];
  st.answers.filter(a=>a.qi===st.qi).forEach(a=>{if(a.i>=0&&a.i<4)cnt[a.i]++});
  const total=Math.max(1,st.players.length);
  const last=st.qi+1>=Q.length;
  app.innerHTML=`<section class="play fade">
    <div class="hud"><span class="chip">Soal ${st.qi+1}/${Q.length}</span><span class="chip">${countAns()}/${st.players.length} menjawab</span></div>
    <div class="qbox"><h2>${it.q}</h2></div>
    <div class="bars">${it.o.map((t,i)=>`<div class="brow"><div class="blabel" style="--c:${CL[i]}"><span class="sh">${SH[i]}</span> ${t}${i===it.a?' ✔':''}</div><div class="btrack"><div class="bfill" style="--c:${CL[i]};width:${cnt[i]/total*100}%"></div></div><b>${cnt[i]}</b></div>`).join('')}</div>
    <p class="res">${it.f}</p>
    <div id="mini">${miniBoard()}</div>
    <div class="row"><button class="go" data-a="hnext">${last?'Lihat juara 🏆':'Soal berikutnya ➜'}</button></div>
  </section>`;
}

function hostNext(){
  if(st.qi+1>=Q.length)return hostEnd();
  st.qi++;
  setRoom({phase:'q',qi:st.qi});
  hostShowQ();
}

function hostEnd(){
  st.phase='end';st.screen='hend';
  clearInterval(st.timer);
  setRoom({phase:'end'});
  const list=sortedPlayers();
  app.innerHTML=`<section class="result fade">
    <div class="kicker">juara kuis</div>
    <h1 class="mid">Podium</h1>
    ${list.length?podiumHTML(list):'<p class="tiny">Tidak ada peserta.</p>'}
    ${restHTML(list)}
    <div class="row"><button class="go" data-a="leave">Selesai</button></div>
  </section>`;
  confetti();
}

function onPlayers(){
  if(st.role==='host'){
    if(st.screen==='hlobby')updateLobby();
    if(st.screen==='hreveal'){const m=$('#mini');if(m)m.innerHTML=miniBoard()}
  }
  if(st.role==='player'&&st.screen==='wait'){const c=$('#wcount');if(c)c.textContent=st.players.length+' peserta sudah masuk'}
}

/* ===== PESERTA ===== */
async function joinGame(){
  const pin=(($('#pin')||{}).value||'').replace(/\D/g,'');
  const name=(($('#nm')||{}).value||'').trim()||'Pemain';
  if(pin.length!==6){setErr('PIN harus 6 digit.');return}
  try{
    const room=await db.ref('rooms/'+pin).once('value');
    if(!room.exists()){setErr('PIN tidak ditemukan.');return}
    const rd=room.val()||{};
    if(rd.phase!=='lobby'){setErr('Game ini sudah mulai. Tunggu game berikutnya.');return}
    await db.ref('players/'+pin+'/'+st.uid).set({name,score:0,at:Date.now()});
    st.role='player';st.pin=pin;st.name=name;st.myScore=0;st.streak=0;
    st.lastQi=-2;st.revealed=-1;st.endShown=false;
    subscribePlayer();
    renderWait();
  }catch(e){
    setErr('Gagal masuk. Cek koneksi dan aturan database.');
  }
}

function subscribePlayer(){
  const pin=st.pin;
  on(db.ref('rooms/'+pin),s=>handleRoom(s.val()));
  on(db.ref('players/'+pin),s=>{st.players=toList(s.val());onPlayers()});
}

function handleRoom(d){
  if(!d)return;
  st.phase=d.phase;
  if(d.phase==='lobby'){if(st.screen!=='wait')renderWait();return}
  if(d.phase==='q'&&d.qi!==st.lastQi){
    st.lastQi=d.qi;st.qi=d.qi;st.locked=false;st.lastI=-1;st.lastGain=0;
    renderPQ();return;
  }
  if(d.phase==='reveal'&&st.revealed!==d.qi&&st.lastQi===d.qi){
    st.revealed=d.qi;st.locked=true;clearInterval(st.timer);
    renderPReveal();return;
  }
  if(d.phase==='end'&&!st.endShown){
    st.endShown=true;clearInterval(st.timer);
    renderPEnd();
  }
}

function renderWait(){
  st.screen='wait';
  app.innerHTML=`<section class="card-main fade">
    <div class="kicker">kamu sudah masuk</div>
    <h1 class="mid">Halo, <span>${esc(st.name)}</span></h1>
    <p class="sub">Tunggu host memulai kuisnya. Jangan tutup halaman ini.</p>
    <p class="pcount" id="wcount">${st.players.length} peserta sudah masuk</p>
    <div class="pulse">●</div>
    <div class="row"><button class="ghost" data-a="leave">Keluar</button></div>
  </section>`;
}

function renderPQ(){
  st.screen='pq';
  const it=Q[st.qi];
  app.innerHTML=`<section class="play fade">
    <div class="hud"><span class="chip">Soal ${st.qi+1}/${Q.length}</span><span class="chip">Skor ${st.myScore}</span></div>
    <div class="timer"><div id="tbar"></div></div>
    <div class="qbox"><h2>${it.q}</h2></div>
    <div class="opts">${tiles(it,true)}</div>
    <p class="res" id="res"></p>
  </section>`;
  st.t0=performance.now();
  clearInterval(st.timer);st.timer=setInterval(tickP,60);
}

function tickP(){
  if(st.locked)return;
  const left=Math.max(0,LIMIT-(performance.now()-st.t0));
  const bar=$('#tbar');if(bar)bar.style.width=(left/LIMIT*100)+'%';
  if(left<=0){
    st.locked=true;clearInterval(st.timer);
    document.querySelectorAll('.opt').forEach(b=>{b.disabled=true;b.classList.add('dim')});
    setRes('<b>Waktu habis!</b> Tunggu soal berikutnya.');
  }
}

function setRes(html){const r=$('#res');if(r)r.innerHTML=html}

function playerAnswer(i){
  if(st.locked||st.role!=='player')return;
  st.locked=true;clearInterval(st.timer);
  const it=Q[st.qi];
  const el=performance.now()-st.t0;
  const ok=i===it.a;
  let gain=0;
  if(ok){st.streak++;gain=500+Math.round(500*Math.max(0,1-el/LIMIT))+Math.min(st.streak-1,3)*50}
  else st.streak=0;
  st.myScore+=gain;st.lastGain=gain;st.lastI=i;
  document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;b.classList.add(k===i?'picked':'dim')});
  setRes('Jawaban terkirim! Tunggu hasilnya...');
  db.ref('answers/'+st.pin+'/'+st.uid).set({qi:st.qi,i,ms:Math.round(el),c:ok}).catch(()=>{});
  db.ref('players/'+st.pin+'/'+st.uid+'/score').set(st.myScore).catch(()=>{});
}

function renderPReveal(){
  st.screen='preveal';
  const it=Q[st.qi];
  document.querySelectorAll('.opt').forEach((b,k)=>{b.disabled=true;b.classList.remove('dim','picked');b.classList.add(k===it.a?'right':k===st.lastI?'wrong':'dim')});
  let head;
  if(st.lastI===-1)head='<b>Tidak sempat menjawab</b>';
  else if(st.lastI===it.a)head=`<b>Benar! +${st.lastGain}</b>`;
  else head='<b>Belum tepat.</b>';
  setRes(head+' '+it.f+`<br><span class="tiny">Skor kamu: ${st.myScore}</span>`);
}

function renderPEnd(){
  st.screen='pend';
  const list=sortedPlayers();
  const idx=list.findIndex(p=>p.id===st.uid);
  const rank=idx>=0?idx+1:null;
  app.innerHTML=`<section class="result fade">
    <div class="kicker">kuis selesai</div>
    <h1 class="big">${st.myScore}</h1>
    <p class="sub">${esc(st.name)}, kamu di peringkat <b>#${rank||'-'}</b> dari ${list.length} pemain.</p>
    ${list.length?podiumHTML(list):''}
    ${restHTML(list)}
    <div class="row"><button class="ghost" data-a="leave">Keluar</button></div>
  </section>`;
  if(rank&&rank<=3)confetti();
}

function leave(){
  if(st.role==='host'&&st.pin&&st.phase!=='end')setRoom({phase:'end'});
  st.role=null;st.pin='';st.phase='';
  renderHome();
}

/* ===== mulai ===== */
function boot(){
  if(!CONFIG.databaseURL||CONFIG.databaseURL.includes('GANTI')){renderSetup();return}
  try{
    firebase.initializeApp({databaseURL:CONFIG.databaseURL});
    db=firebase.database();
  }catch(e){
    renderSetup();return;
  }
  renderHome();
}
boot();
</script>
</body>
</html>
